name: Release compatibility gem

# Publishes compat/ruby_llm-schema, the final release of the old gem name. It forwards to
# schematist and is expected to be published once, so this is a no-op on every run after that.
# Schematist has to be on RubyGems first, since the compatibility gem depends on it.

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build + Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compat/ruby_llm-schema

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Check if version needs publishing
        id: check_version
        run: |
          set -euo pipefail
          VERSION=$(ruby -e 'puts Gem::Specification.load("ruby_llm-schema.gemspec").version' 2>/dev/null)

          if [ -z "$VERSION" ]; then
            echo "Error: Could not read the version from ruby_llm-schema.gemspec" >&2
            exit 1
          fi
          echo "Local version: $VERSION"

          GEM_NAME="ruby_llm-schema"

          ALL_PUBLISHED_VERSIONS=$(( \
            gem list ^${GEM_NAME}$ -r --all 2>/dev/null || true; \
            gem list ^${GEM_NAME}$ -r --prerelease 2>/dev/null || true; \
          ) | sed -n 's/.*(\(.*\)).*/\1/p' \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep . \
            | sort -u )

          if echo "$ALL_PUBLISHED_VERSIONS" | grep -Fxq "$VERSION"; then
            echo "Verdict: Version $VERSION already published."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Verdict: Version $VERSION is new."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Publish to RubyGems
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
          gem build ruby_llm-schema.gemspec
          output=$(gem push ruby_llm-schema-*.gem 2>&1) || {
            echo "$output"
            if echo "$output" | grep -q "Repushing of gem versions is not allowed"; then
              echo "Version already exists, skipping"
              exit 0
            else
              exit 1
            fi
          }
        env:
          GEM_HOST_API_KEY: "${{ secrets.RUBYGEMS_AUTH_TOKEN }}"
